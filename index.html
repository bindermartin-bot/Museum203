      <param name="A_09" value="id='TEXT' matriz='sí' evaluar='una-sola-vez' columnas='NP' filas='NP' expresión='TEXT[0,1]=&squot;Dies ist Ihre Bewertung. Sie können die Position der Radarfallen ansehen und die\ngesetzlichen Bestimmungen.&squot;;TEXT[0,6]=&squot;Hier sehen Sie die drei Funktionen (Position, Geschwindigkeit und Beschleunigung) ihrer Fahrt.\nSie können diese abspielen und analysieren.&squot;;TEXT[1,0]=&squot;Die Ausbreitung einer Krankheit in einer abgeschlossenen Bevölkerung wird modelliert. Die Grafik zeigt\nden Verlauf von Nicht-Infizierten, Infizierten, Schwerkranken, Toten und Genesenen im Verlauf der Zeit.&squot;;TEXT[1,1]=&squot;Das Modell wird gesteuert durch zwei Verweildauern (in leicht oder schwerem Krankheitszustand)\nund den Wahrscheinlichkeiten zu genesen (bei geimpften bzw. ungeimpften Personen).&squot;;TEXT[1,2]=&squot;Das Diagramm zeigt die Modellierung durch Behälter. Angezeigt wird der aktuelle Stand am gegebenen Tag.\nBei den Pfeilen stehen die Durchflussmengen für den nächsten Tag.&squot;;TEXT[1,3]=&squot;Es fehlt noch die Erklärung, wie die Durchflussmengen berechnet werden. Der Abfluss aus dem\nBehälter der Nichtinfizierten ist proportional zur Anzahl Nicht-Infizierter und auch proportional zur Anzahl aller\nPersonen, die infizieren können: Infizierte und Schwerkranke.\nDa die Schwerkranken jedoch meist hospitalisiert sind, führt diese zu weniger Ansteckungen.\n\nDie Änderungsrate der Nicht-Infizierten wird nach folgender Formel berechnet:&squot;;TEXT[5,0]=&squot;&squot;;TEXT[5,1]=&squot;&squot;;TEXT[3,0]=&squot;Mit den blauen Punkten\nkontrollieren Sie die Form\ndes blauen Graphen.\n\nMit den grünen Punkten\ndefinieren Sie eine Sekante\n(in Grün).\n\nDie rote Gerade ist die\nTangente im Punkt P an den\nblauen Graph. Diese berührt\nden Graphen in P.\n\nVerkleinern Sie den Abstand\nzwischen den grünen Punkten\nund bringen Sie die Sekante\nzur Deckung mit der Tangen-\nten.&squot;;TEXT[3,1]=&squot;Jetzt wird nur noch die\nTangente gezeigt, sowie deren\nSteigung.\n\nBewegen Sie den grünen Punkt,\num immer mehr Tangenten-\nsteigungen in rot anzugeben.&squot;;TEXT[3,2]=&squot;Aus einer Funktion f wird so\neine neue Funktion.\n\nMan nennt die rote Funktion\ndie Ableitungsfunktion.&squot;;TEXT[3,3]=&squot;Wählen Sie einen Funktions-\ntyp und verändern Sie die\nZahlen (sog. Koeffizienten).\nRechts sehen Sie den Graph\nder Funktion (in blau) sowie\nderen Ableitung (in rot).&squot;;' tipo='matriz' ">
